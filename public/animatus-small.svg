<svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 200 200"
      width="50"
      height="50"
      
    >
      <circle
        cx="100"
        cy="100"
        r="95"
        fill="none"
        stroke="grey"
        stroke-width="6"
        stroke-dasharray="15,10"
      >
        <animate
          attributeName="stroke-dashoffset"
          from="0"
          to="100"
          dur="10s"
          repeatCount="indefinite"
        />
      </circle>
    
      <image
        href="data:image/png;base64,"
        x="10"
        y="15"
        width="180"
        height="180"
      />
    </svg>